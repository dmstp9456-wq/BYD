<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYD 상담 예약 | 오은세</title><meta name="description" content="BYD 수원전시장 오은세에게 차량 견적, 시승, 재고 및 출고 상담을 신청하세요."><meta name="theme-color" content="#101112"><link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./assets/css/style.css"><script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><script defer src="./assets/js/config.js"></script><script defer src="./assets/js/reservation.js"></script></head>
<body class="form-page"><header class="form-header"><a class="brand" href="./index.html"><span class="brand-mark">BYD</span><span class="brand-copy">SUWON <b>오은세</b></span></a><a class="back-link" href="./index.html">← 홈페이지로 돌아가기</a></header>
<main class="form-shell"><div class="form-heading"><p class="eyebrow">PERSONAL CONSULTATION</p><h1>나에게 맞는 BYD,<br><em>편하게 문의하세요.</em></h1><p>희망하시는 차량과 상담 내용을 남겨주시면 확인 후 연락드리겠습니다.</p></div>
<form class="form-card" id="reservationForm"><div class="form-grid">
<div class="field"><label for="customer_name">성함 <i>*</i></label><input id="customer_name" name="customer_name" autocomplete="name" required placeholder="성함을 입력해 주세요"></div>
<div class="field"><label for="customer_phone">연락처 <i>*</i></label><input id="customer_phone" name="customer_phone" type="tel" autocomplete="tel" required inputmode="tel" placeholder="010-0000-0000"></div>
<div class="field"><label for="vehicle">관심 차량</label><select id="vehicle" name="vehicle"><option value="">차량을 선택해 주세요</option><option>씨라이언 6 DM-i</option><option>씨라이언 7</option><option>아토 3</option><option>씰</option><option>돌핀</option><option>아직 결정하지 못했어요</option></select></div>
<div class="field"><label for="consultation_type">상담 유형</label><select id="consultation_type" name="consultation_type"><option>차량 견적 문의</option><option>시승 예약</option><option>재고 및 출고 문의</option><option>할부 · 리스 · 렌트 문의</option><option>기타 상담</option></select></div>
<div class="field"><label for="visit_date">희망 상담 날짜</label><input id="visit_date" name="visit_date" type="date"></div>
<div class="field"><label for="visit_time">희망 상담 시간</label><select id="visit_time" name="visit_time"><option value="">시간 미정</option><option>오전 10시~12시</option><option>오후 12시~14시</option><option>오후 14시~16시</option><option>오후 16시~18시</option></select></div>
<div class="field full"><label for="message">문의 내용</label><textarea id="message" name="message" placeholder="예산, 구매 시기, 궁금한 점 등을 자유롭게 적어주세요."></textarea></div>
</div>
<label class="privacy"><input type="checkbox" id="privacy_consent" required><span><b>[필수]</b> 상담을 위한 개인정보 수집 및 이용에 동의합니다. 수집 항목: 성함, 연락처, 상담 내용 / 이용 목적: 차량 상담 및 문의 응대 / 보유 기간: 상담 목적 달성 후 지체 없이 파기 (관련 법령에 따라 보관이 필요한 경우 해당 기간 보관)</span></label>
<button class="submit-btn" id="submitBtn" type="submit">상담 신청 보내기 <span>↗</span></button><div class="status" id="formStatus" role="status" aria-live="polite"></div><p class="form-note">BYD 수원 오토월드 전시장 · 오은세 · 010-2495-9456</p></form></main></body></html>
